[package]
name = "http-api"
description = "finbot REST API (axum): routes, auth, problem+json errors, OpenAPI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
app.workspace = true
domain.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
axum = { version = "0.8.9", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7.1", features = ["trace", "timeout", "limit"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }

[dev-dependencies]
app = { workspace = true, features = ["test-support"] }
tokio.workspace = true
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
