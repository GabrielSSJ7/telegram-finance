[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
app = { path = "crates/app" }
pg = { path = "crates/pg" }
http-api = { path = "crates/http" }
telegram = { path = "crates/telegram" }

async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tokio-util = "0.7.19"
tracing = "0.1"
uuid = { version = "1.26.1", features = ["v7", "serde"] }
sha2 = "0.11.0"
hex = "0.4.3"
proptest = "1.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "chrono", "uuid", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Enforces the project rule "functions 4-20 lines" (threshold in clippy.toml).
too_many_lines = "warn"
unwrap_used = "deny"
expect_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
return_self_not_must_use = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
