# Local development database. Data persists in a named volume.
# `make dev` starts it and runs finbot from source against it.
name: finbot-dev

services:
  dev-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: finbot
      POSTGRES_PASSWORD: finbot
      POSTGRES_DB: finbot
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker.
      - dev-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finbot -d finbot"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  dev-pgdata:
