name: release

# Tag v* → build and push ghcr.io/<owner>/finbot and finbot-backup, then
# optionally deploy over SSH (set repository variable AUTO_DEPLOY=true and
# secrets VPS_HOST, VPS_USER, VPS_SSH_KEY).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: gabrielssj7

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: finbot
            context: .
            file: docker/app.Dockerfile
          - name: finbot-backup
            context: docker/backup
            file: docker/backup/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    if: vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Deploy on the VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          TAG: ${{ github.ref_name }}
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 0600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$VPS" \
            "cd /opt/finbot && ./scripts/deploy.sh '$TAG'"
