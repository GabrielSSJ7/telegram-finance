[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is a compile-time macro pulled in by utoipa-axum. Unmaintained
    # is not a vulnerability; revisit when utoipa-axum drops it.
    { id = "RUSTSEC-2024-0436", reason = "compile-time only, via utoipa-axum; no known vulnerability" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
exceptions = [
    # Telegram client; WTFPL is permissive (FSF free) and limited to this crate.
    { allow = ["WTFPL"], crate = "frankenstein" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
