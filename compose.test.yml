# Throwaway Postgres for `make test`. Data lives in tmpfs, so every run
# starts clean. #[sqlx::test] creates one database per test on this server.
name: finbot-test

services:
  test-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: finbot
      POSTGRES_PASSWORD: finbot
      POSTGRES_DB: finbot
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql
    command: ["postgres", "-c", "fsync=off", "-c", "full_page_writes=off", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finbot -d finbot"]
      interval: 1s
      timeout: 3s
      retries: 30
